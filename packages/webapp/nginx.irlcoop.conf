user nginx;
worker_processes auto;
error_log /dev/stdout info;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 20M;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    types {
        application/manifest+json webmanifest;
    }
    server_tokens off;
    access_log /dev/stdout;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/x-javascript
        application/xml
        application/javascript
        application/json
        image/svg+xml;

    server {
        # Serves the built SPA only — the API lives on a sibling domain
        # (VITE_API_URL → farmapi.irl.coop), behind the traefik edge (no TLS
        # here). server_name _ matches any host.
        listen 80;
        server_name _;
        root /var/www/litefarm;

        location = /index.html {
            add_header Cache-Control "public, max-age=0, must-revalidate" always;
        }
        location = /manifest.webmanifest {
            add_header Cache-Control "public, max-age=0, must-revalidate" always;
        }
        location = /sw.js {
            add_header Cache-Control "public, max-age=0, must-revalidate" always;
        }
        location ^~ /assets/ {
            add_header Cache-Control "public, max-age=31536000, s-maxage=31536000, immutable";
            try_files $uri =404;
        }
        location ^~ /workbox- {
            add_header Cache-Control "public, max-age=31536000, s-maxage=31536000, immutable";
            try_files $uri =404;
        }

        # irl.coop gate SSO: proxy to the API (same-origin) so the SPA can
        # fetch /gate_sso without a cross-origin hop. The fleet gate re-injects
        # X-Forwarded-User/Email on every request; pass them through.
        location /gate_sso {
            proxy_pass http://litefarm:5000;
            proxy_pass_request_headers on;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-User $http_x_forwarded_user;
            proxy_set_header X-Forwarded-Email $http_x_forwarded_email;
            proxy_set_header X-Forwarded-Preferred-Username $http_x_forwarded_preferred_username;
        }

        location / {
            try_files $uri /index.html =404;
        }
    }
}
